spring.application.name=lifethon

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:8080/LifeThon
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Settings (Optional but recommended)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Change Spring Boot web server port
server.port=8081

# JWT Configuration
jwt.secret=your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-please-change-this-in-production
jwt.expiration=86400000
# 86400000 ms = 24 hours
# For refresh token (optional)
jwt.refresh.expiration=604800000
# 604800000 ms = 7 days